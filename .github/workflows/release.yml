name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: |
          echo "token length: ${#NODE_AUTH_TOKEN}"
          curl -s -o /dev/null -w "tarball: %{http_code}\n" -H "Authorization: Bearer $NODE_AUTH_TOKEN" "https://npm.pkg.github.com/download/@opensourceclaw/claw-gov/7.5.0/37307d103b4e870603da254943973e2619cd63b3"
          echo "--- project npmrc:"; cat .npmrc
          echo "--- temp npmrc:"; cat $NPM_CONFIG_USERCONFIG
          npm ci
      - run: npm run build
      - run: npm test -- --no-coverage
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh release view ${{ github.ref_name }} && echo "release exists, skip" || gh release create ${{ github.ref_name }} --generate-notes --title "claw-mem ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
