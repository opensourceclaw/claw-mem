name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Provide claw-gov stub for file dependency
        run: |
          mkdir -p ../claw-gov
          cp -r ci/stubs/claw-gov/. ../claw-gov/
      - run: npm ci
      - run: npm audit --production
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: ['22', '24']
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Provide claw-gov stub for file dependency
        run: |
          mkdir -p ../claw-gov
          cp -r ci/stubs/claw-gov/. ../claw-gov/
      - run: npm ci
      - run: npm run build
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Provide claw-gov stub for file dependency
        run: |
          mkdir -p ../claw-gov
          cp -r ci/stubs/claw-gov/. ../claw-gov/
      - run: npm ci
      - run: npm run build