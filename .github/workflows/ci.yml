name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  # ========== STAGE 1: LINT (Code Quality) ==========
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint || true
      - name: Run ESLint
        run: npm run lint 2>/dev/null || echo "No lint script"

  # ========== STAGE 2: TEST (Test) ==========
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
        continue-on-error: true

  # ========== STAGE 3: BUILD (Build) ==========
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  # ========== STAGE 4: DEPLOY (Deploy to GitHub Packages) ==========
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
      - run: npm run build
      - name: Build plugin
        working-directory: claw_mem_plugin
        run: |
          npm ci
          npm run build
      - name: Publish to GitHub Packages
        working-directory: claw_mem_plugin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== STAGE 5: GITHUB DEPLOYMENT ==========
  deployment:
    name: GitHub Deployment
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract version
        id: extract_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          environment: production
          description: "claw-mem v${{ steps.extract_version.outputs.version }} deployment"
          ref: ${{ github.sha }}
          ref_type: commit
          
      - name: Update Deployment Status (success)
        if: success()
        uses: chrnorm/deployment-status-action@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          environment: production
          state: success
          description: "Deployment successful"
          log_url: "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.extract_version.outputs.version }}"
          
      - name: Update Deployment Status (failure)
        if: failure()
        uses: chrnorm/deployment-status-action@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          environment: production
          state: failure
          description: "Deployment failed"

  # ========== STAGE 6: BENCHMARK (Performance) ==========
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Run benchmarks
        run: npm run benchmark || echo "No benchmark script"
      - name: Comment on release
        uses: actions/github-script@v7
        if: github.event_name == 'release'
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('./benchmark-results.json', 'utf8').catch(() => '{}');
            const body = `### Benchmark Results\n\`\`\`json\n${results}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
        continue-on-error: true