name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      - name: Run ESLint
        run: npm run lint 2>/dev/null || echo "No lint script"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      
      # Install sibling packages for integration tests
      - name: Install claw-cog
        run: npm install opensourceclaw-claw-cog || npm install claw-cog || true
      - name: Install claw-gov
        run: npm install opensourceclaw-claw-gov || npm install claw-gov || true
      
      - run: npm run test || true
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      - run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: 'https://npm.pkg.github.com'
      - run: npm install
      - run: npm run build
      - name: Build plugin
        working-directory: claw_mem_plugin
        run: npm install && npm run build
      - name: Publish to GitHub Packages
        working-directory: claw_mem_plugin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment:
    name: GitHub Deployment
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract version
        id: extract_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          environment: production
          description: "claw-mem v${{ steps.extract_version.outputs.version }} deployment"
          ref: ${{ github.sha }}
          ref_type: commit
          
      - name: Update Deployment Status
        uses: chrnorm/deployment-status-action@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          environment: production
          state: success
          description: "Deployment completed"
        if: success()
